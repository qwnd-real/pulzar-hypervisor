[workspace]
resolver = "3"
members = ["crates/hv-core", "crates/hv-loader", "crates/serial", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# rust-osdev UEFI bindings. `panic_handler` and `global_allocator` install the
# crate's own handlers so firmware-side binaries need no boilerplate of their
# own. The `logger` feature stays off: it would claim the global `log` slot
# that the serial backend owns (`uefi::println!` works without it).
uefi = { version = "0.39.0", features = ["panic_handler", "global_allocator"] }

# Firmware-side logging stack: `log` is the facade the binaries log through,
# `serial` is this workspace's 16550 UART backend behind it, `spin` supplies
# the no_std locks, `thiserror` derives the error types (default features
# off: they pull in std), and `x86_64` wraps port I/O and interrupt control.
log = "0.4"
serial = { path = "crates/serial" }
spin = "0.12"
thiserror = { version = "2.0", default-features = false }
x86_64 = "0.15"

# Host-side dependencies, used only by the `xtask` runner.
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
ovmf-prebuilt = "0.2.9"
sha2 = "0.11"
ureq = "3.3"

# Zero-warnings policy: every rustc warning and all of
# clippy::pedantic are hard errors. Exceptions only as narrowly scoped
# `#[expect(..., reason = "...")]` attributes — never blanket downgrades.
[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
allow_attributes_without_reason = "deny"
