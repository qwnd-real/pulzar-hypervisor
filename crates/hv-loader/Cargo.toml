[package]
name = "hv-loader"
description = "First-stage UEFI loader for the pulzar hypervisor"
version.workspace = true
edition.workspace = true
publish.workspace = true

# A `no_std` UEFI binary cannot host the libtest harness (it would link a
# second panic handler), so test/bench targets are disabled explicitly.
[[bin]]
name = "hv-loader"
test = false
bench = false

[dependencies]
uefi = { workspace = true }

[lints]
workspace = true
