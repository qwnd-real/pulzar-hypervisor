# `per-package-target` lets this manifest pin its own build target, so the
# workspace needs no global default and host-side crates coexist with UEFI
# ones under a plain `cargo build`.
cargo-features = ["per-package-target"]

[package]
name = "vlapic"
description = "The local interrupt controller a guest sees, in place of the machine's own"
version.workspace = true
edition.workspace = true
publish.workspace = true
forced-target = "x86_64-unknown-uefi"

[dependencies]
apic = { workspace = true }
bitfield-struct = { workspace = true }
bitflags = { workspace = true }
cpu = { workspace = true }
descriptors = { workspace = true }
emulate = { workspace = true }
ipi = { workspace = true }
log = { workspace = true }
processor = { workspace = true }
snapshot = { workspace = true }
spin = { workspace = true }
thiserror = { workspace = true }
x86_64 = { workspace = true }

[lints]
workspace = true
