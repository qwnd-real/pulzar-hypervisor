[package]
name = "descriptors"
description = "Host descriptor tables and interrupt dispatch for the pulzar hypervisor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
log = { workspace = true }
paging = { workspace = true }
# The logging backend, not just the facade: a fault or a non-maskable interrupt
# can arrive while the interrupted code on this very processor holds the
# logger's lock, and only the backend can offer a path that takes no lock.
serial = { workspace = true }
spin = { workspace = true }
thiserror = { workspace = true }
x86_64 = { workspace = true }

