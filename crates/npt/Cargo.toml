# `per-package-target` lets this manifest pin its own build target, so the
# workspace needs no global default and host-side crates coexist with UEFI
# ones under a plain `cargo build`.
cargo-features = ["per-package-target"]

[package]
name = "npt"
description = "The second set of page tables a guest's physical addresses are translated by"
version.workspace = true
edition.workspace = true
publish.workspace = true
forced-target = "x86_64-unknown-uefi"

[dependencies]
log = { workspace = true }
paging = { workspace = true }
processor = { workspace = true }
svm = { workspace = true }
thiserror = { workspace = true }
x86_64 = { workspace = true }

[lints]
workspace = true
