# `per-package-target` lets this manifest pin its own build target, so the
# workspace needs no global default and host-side crates coexist with UEFI
# ones under a plain `cargo build`.
cargo-features = ["per-package-target"]

[package]
name = "partition"
description = "One guest: the memory it sees, and the tag its cached translations carry"
version.workspace = true
edition.workspace = true
publish.workspace = true
forced-target = "x86_64-unknown-uefi"

[dependencies]
emulate = { workspace = true }
log = { workspace = true }
memory = { workspace = true }
npt = { workspace = true }
paging = { workspace = true }
processor = { workspace = true }
spin = { workspace = true }
svm = { workspace = true }
thiserror = { workspace = true }
vcpu = { workspace = true }
x86_64 = { workspace = true }

[lints]
workspace = true
