[package]
name = "serial"
description = "Logging backends for the firmware-side pulzar binaries: debugcon, 16550 UART, UEFI frame buffer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clock = { workspace = true }
handoff = { workspace = true }
log = { workspace = true }
spin = { workspace = true }
thiserror = { workspace = true }
x86_64 = { workspace = true }

# The glyph tables are only compiled when the screen backend is, and the
# feature is what pulls them in.
font8x8 = { workspace = true, optional = true }

[features]
# Compiles every log record out of the whole image.
#
# `log`'s static maximum level becomes `Off`, which the log macros are expanded
# against at compile time: no record is formatted, no lock is taken, no byte
# reaches a port, and the arguments are not evaluated either — so the register
# reads and controller queries that only ever fed a trace line stop happening
# as well. `log` is compiled once for the build, so enabling this anywhere
# strips every crate's records and not just this one's.
#
# For a real machine, where a byte down a 16550 costs 260 µs with interrupts
# held off, and the machine has a header whether or not anything is plugged
# into it.
quiet = ["log/max_level_off"]

# The UEFI frame-buffer backend: log lines drawn as pixels onto the screen
# firmware left behind, for machines with neither a debug console nor a UART
# header. Off by default, because a screen is a guest-facing device here —
# once the firmware guest starts drawing, the display belongs to it.
efifb = ["dep:font8x8"]

[lints]
workspace = true
