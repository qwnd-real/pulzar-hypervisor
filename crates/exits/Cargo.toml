[package]
name = "exits"
description = "What a guest's exits mean, and what the host does about each of them"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bitflags = { workspace = true }
inject = { workspace = true }
descriptors = { workspace = true }
apic = { workspace = true }
emulate = { workspace = true }
# The interface a guest's own debugging tool reaches this hypervisor through,
# and the layout of what it is answered with.
hypercall = { workspace = true }
log = { workspace = true }
# Reaching the buffer a hypercall names, which is a linear address of the
# calling guest and has to be walked as one.
memory = { workspace = true }
# Taking the storage controllers over at the moment firmware's services end,
# which is what this crate's notification of that moment exists to sequence.
nvme = { workspace = true }
npt = { workspace = true }
partition = { workspace = true }
portal = { workspace = true }
# How a register the machine may not have is reached: an access outside the
# permission map's three ranges is intercepted whatever the map says, and the
# only way to find out whether such a register exists is to attempt it.
probe = { workspace = true }
processor = { workspace = true }
svm = { workspace = true }
thiserror = { workspace = true }
vcpu = { workspace = true }
vlapic = { workspace = true }
x86_64 = { workspace = true }

[lints]
workspace = true
