# `per-package-target` lets this manifest pin its own build target, so the
# workspace needs no global default and host-side crates coexist with UEFI
# ones under a plain `cargo build`.
cargo-features = ["per-package-target"]

[package]
name = "hv-core"
description = "Hypervisor image for pulzar (currently a stub)"
version.workspace = true
edition.workspace = true
publish.workspace = true
forced-target = "x86_64-unknown-uefi"

# A `no_std` UEFI binary cannot host the libtest harness (it would link a
# second panic handler), so test/bench targets are disabled explicitly.
[[bin]]
name = "hv-core"
test = false
bench = false

[dependencies]
uefi = { workspace = true }

[lints]
workspace = true
