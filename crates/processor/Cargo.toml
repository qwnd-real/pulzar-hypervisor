# `per-package-target` lets this manifest pin its own build target, so the
# workspace needs no global default and host-side crates coexist with UEFI
# ones under a plain `cargo build`.
cargo-features = ["per-package-target"]

[package]
name = "processor"
description = "What the processor pulzar runs on can do, asked once and cached"
version.workspace = true
edition.workspace = true
publish.workspace = true
forced-target = "x86_64-unknown-uefi"

[dependencies]
bitflags = { workspace = true }
log = { workspace = true }
raw-cpuid = { workspace = true }
spin = { workspace = true }

[lints]
workspace = true
