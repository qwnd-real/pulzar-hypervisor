# Pinned nightly (never a floating channel): needed for future `-Z build-std`
# on the freestanding hypervisor target and for unstable rustfmt options.
# Bumping the pin is a deliberate decision — see AGENTS.md §3.
[toolchain]
channel = "nightly-2026-07-23"
components = ["clippy", "rustfmt", "rust-src"]
targets = ["x86_64-unknown-uefi"]
